<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4d7d">
  <title>♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tashqi to'q fon (desktopda ko'rinadi) -->
  <div class="page-bg"></div>

  <!-- Telefon konteyneri -->
  <div class="phone" id="phone">

    <!-- Suzib yuruvchi yuraklar (fon animatsiya) -->
    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <!-- Progress bar -->
    <div class="progress">
      <div class="progress__bar" id="progressBar"></div>
    </div>

    <!-- Sarlavha -->
    <header class="topbar">
      <div class="brand" id="brand">♡</div>
    </header>

    <!-- Ekranlar shu yerga chiqadi -->
    <main class="stage" id="stage"></main>

    <!-- Toast (xato/eslatma) -->
    <div class="toast" id="toast"></div>

    <!-- Konfetti canvas (final ekran uchun) -->
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
